<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Town · AI小镇</title>
<style>
:root {
  --purple: #A100FF;
  --purple-dark: #6B00AA;
  --purple-glow: rgba(161,0,255,0.35);
  --cyan: #00E5FF;
  --green: #00E676;
  --amber: #FFD600;
  --red: #FF1744;
  --dark: #0A0A14;
  --dark2: #10101E;
  --panel: #13131F;
  --panel2: #1A1A2E;
  --border: rgba(161,0,255,0.3);
  --text: rgba(255,255,255,0.88);
  --text-dim: rgba(255,255,255,0.45);
  --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', monospace;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: var(--font);
  background: var(--dark);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ─── TOP BAR ─── */
.topbar {
  height: 46px;
  background: rgba(10,10,20,0.98);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 18px;
  flex-shrink: 0;
  z-index: 100;
  backdrop-filter: blur(10px);
}
.tb-brand { display:flex; align-items:center; gap:10px; }
.tb-logo {
  width:28px; height:28px; border-radius:50%;
  background: var(--purple);
  display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:900; color:white;
  box-shadow: 0 0 10px var(--purple-glow);
}
.tb-name { font-size:14px; font-weight:800; }
.tb-name span { color: var(--purple); }
.tb-center { display:flex; align-items:center; gap:12px; }
.tb-day {
  background: rgba(161,0,255,0.12);
  border: 1px solid var(--border);
  color: var(--purple);
  font-size:11px; font-weight:700;
  padding: 3px 12px; border-radius:20px;
  letter-spacing:.5px;
}
.tb-time {
  font-size:12px; color:var(--cyan);
  font-family: monospace; font-weight:700;
  background: rgba(0,229,255,0.08);
  padding: 3px 10px; border-radius:4px;
  border: 1px solid rgba(0,229,255,0.2);
}
.tb-right { display:flex; align-items:center; gap:10px; }
.tb-stat {
  display:flex; align-items:center; gap:5px;
  font-size:11px; color:var(--text-dim);
}
.stat-dot { width:6px; height:6px; border-radius:50%; }
.dot-green { background:var(--green); box-shadow:0 0 4px var(--green); animation: pulse .8s infinite alternate; }
.dot-purple { background:var(--purple); box-shadow:0 0 4px var(--purple); animation: pulse 1.2s infinite alternate; }
.dot-cyan { background:var(--cyan); box-shadow:0 0 4px var(--cyan); animation: pulse 1s infinite alternate; }
@keyframes pulse { to { opacity:.4; } }

/* ─── MAIN LAYOUT ─── */
.main {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 280px;
  overflow: hidden;
}

/* ─── TOWN CANVAS ─── */
.town-wrap {
  position: relative;
  overflow: hidden;
  background: #0C1A0C;
}
#townCanvas {
  display: block;
  width: 100%; height: 100%;
}

/* ─── RIGHT PANEL ─── */
.side-panel {
  background: var(--panel);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}

/* Panel sections */
.panel-sec {
  border-bottom: 1px solid rgba(255,255,255,0.06);
  padding: 12px 14px;
}
.panel-sec:last-child { border-bottom: none; flex:1; overflow-y:auto; }
.p-title {
  font-size: 10px; font-weight: 800;
  text-transform: uppercase; letter-spacing: 1px;
  color: var(--purple);
  margin-bottom: 8px;
  display: flex; align-items:center; gap:6px;
}
.p-title::before { content:''; width:8px; height:2px; background:var(--purple); border-radius:1px; }

/* Agent cards */
.agent-card {
  display:flex; align-items:center; gap:8px;
  padding: 7px 8px; border-radius:7px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.05);
  margin-bottom: 6px;
  cursor:pointer;
  transition: all .15s;
}
.agent-card:hover, .agent-card.selected {
  background: rgba(161,0,255,0.12);
  border-color: var(--border);
}
.agent-avatar {
  width:28px; height:28px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; flex-shrink:0;
  border: 2px solid rgba(255,255,255,0.1);
}
.agent-info { flex:1; min-width:0; }
.agent-name { font-size:12px; font-weight:700; }
.agent-role { font-size:10px; color:var(--text-dim); }
.agent-status {
  font-size:9px; font-weight:700;
  padding:2px 7px; border-radius:10px;
  flex-shrink:0;
}
.s-working { background:rgba(0,230,118,0.15); color:var(--green); border:1px solid rgba(0,230,118,0.3); }
.s-meeting { background:rgba(0,229,255,0.12); color:var(--cyan); border:1px solid rgba(0,229,255,0.3); }
.s-idle    { background:rgba(255,255,255,0.06); color:var(--text-dim); border:1px solid rgba(255,255,255,0.1); }
.s-chat    { background:rgba(255,214,0,0.12); color:var(--amber); border:1px solid rgba(255,214,0,0.3); }

/* Chat log */
.chat-log {
  display:flex; flex-direction:column; gap:6px;
  overflow-y:auto; max-height:100%;
}
.chat-msg {
  display:flex; gap:7px; align-items:flex-start;
  animation: slideIn .3s ease;
}
@keyframes slideIn {
  from { opacity:0; transform:translateY(6px); }
  to   { opacity:1; transform:translateY(0); }
}
.chat-ava {
  width:22px; height:22px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; flex-shrink:0; margin-top:1px;
}
.chat-body { flex:1; }
.chat-name { font-size:10px; font-weight:800; margin-bottom:2px; }
.chat-text {
  font-size:11px; color:rgba(255,255,255,0.75);
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius:0 8px 8px 8px;
  padding:6px 9px;
  line-height:1.5;
}
.chat-time { font-size:9px; color:var(--text-dim); margin-top:2px; }

/* Task tracker */
.task-item {
  display:flex; align-items:flex-start; gap:8px;
  padding:7px 8px; border-radius:6px;
  background:rgba(255,255,255,0.025);
  border:1px solid rgba(255,255,255,0.05);
  margin-bottom:5px;
}
.task-icon { font-size:14px; flex-shrink:0; }
.task-body { flex:1; min-width:0; }
.task-name { font-size:11px; font-weight:700; color:var(--text); }
.task-owner { font-size:10px; color:var(--text-dim); margin-top:1px; }
.task-progress {
  height:3px; background:rgba(255,255,255,0.08);
  border-radius:2px; margin-top:5px; overflow:hidden;
}
.tp-fill { height:100%; border-radius:2px; transition:width 2s ease; }

/* Event log chip */
.event-chip {
  display:flex; align-items:center; gap:6px;
  font-size:10px; padding:5px 9px;
  border-radius:5px; margin-bottom:4px;
  background:rgba(255,255,255,0.03);
  border-left:2px solid;
  animation: slideIn .3s ease;
}
.ev-purple { border-color:var(--purple); }
.ev-cyan   { border-color:var(--cyan); }
.ev-green  { border-color:var(--green); }
.ev-amber  { border-color:var(--amber); }
.event-time { color:var(--text-dim); flex-shrink:0; }
.event-text { color:var(--text); }

/* ─── LEGEND ─── */
.legend {
  position:absolute; bottom:14px; left:14px;
  background:rgba(10,10,20,0.88);
  border:1px solid var(--border);
  border-radius:8px; padding:10px 14px;
  backdrop-filter:blur(8px);
  z-index:10;
}
.legend-title { font-size:10px; font-weight:800; color:var(--purple); letter-spacing:.8px; margin-bottom:7px; }
.legend-row { display:flex; align-items:center; gap:7px; font-size:10px; color:var(--text-dim); margin-bottom:4px; }
.leg-box { width:14px; height:14px; border-radius:3px; flex-shrink:0; }

/* ─── SELECTED AGENT BUBBLE ─── */
.agent-spotlight {
  position:absolute; top:14px; left:14px;
  background:rgba(10,10,20,0.92);
  border:1px solid var(--border);
  border-radius:10px; padding:12px 16px;
  backdrop-filter:blur(10px);
  z-index:10;
  min-width:220px;
  display:none;
}
.as-header { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.as-ava { width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px; border:2px solid var(--purple); }
.as-name { font-size:14px; font-weight:900; }
.as-role { font-size:11px; color:var(--text-dim); }
.as-thought {
  background:rgba(161,0,255,0.08); border:1px solid var(--border);
  border-radius:6px; padding:8px 10px; font-size:11px; color:var(--text);
  line-height:1.6; margin-bottom:8px;
}
.as-loc { font-size:10px; color:var(--text-dim); }
.as-loc span { color:var(--cyan); font-weight:700; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="tb-brand">
    <div class="tb-logo">Ac</div>
    <div class="tb-name">AI <span>Town</span></div>
    <div style="font-size:11px;color:var(--text-dim);margin-left:4px;">· 上海 AI 创新中心模拟</div>

<!-- MAIN -->
<div class="main">

      <div class="legend-row"><div class="leg-box" style="background:#1A2A3A;border:1px solid #2E4A6B;"></div>会议室</div>
      <div class="legend-row"><div class="leg-box" style="background:#2A1A10;border:1px solid #6B3A1A;"></div>咖啡间</div>
      <div class="legend-row"><div class="leg-box" style="background:#1A103A;border:1px solid #4A2A8A;"></div>AI计算中心</div>

      <div style="margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,0.08);font-size:10px;color:var(--text-dim);">点击角色查看详情</div>

  <!-- RIGHT PANEL -->
  <div class="side-panel">

    <!-- Agents -->
    <div class="panel-sec" style="padding-bottom:10px;">

    <!-- Tasks -->
    <div class="panel-sec">
      <div class="p-title">📋 Sprint 任务</div>
      <div id="taskList"></div>

    <!-- Chat / Event log -->
    <div class="panel-sec" style="flex:1;overflow:hidden;display:flex;flex-direction:column;">
      <div class="p-title">💬 实时通信流</div>
      <div class="chat-log" id="chatLog"></div>
    </div>

  </div>
</div>

<script>
// ═══════════════════════════════════════════
// WORLD CONFIG
// ═══════════════════════════════════════════
const canvas = document.getElementById('townCanvas');
const ctx = canvas.getContext('2d');

const TILE = 32; // pixels per tile

// Map dimensions
let COLS, ROWS, OX, OY;

// Tile types
const T = {
  GRASS:   0,
  FLOOR_O: 1, // open office
  FLOOR_M: 2, // meeting
  FLOOR_C: 3, // cafe
  FLOOR_S: 4, // server
  FLOOR_L: 5, // lounge
  WALL:    6,
  DESK:    7,
  TABLE:   8,
  PLANT:   9,
  SERVER:  10,
  SOFA:    11,
  COFFEE:  12,
  DOOR:    13,
  PATH:    14,
};

const TILE_COLORS = {
  [T.GRASS]:   '#0C1A0C',
  [T.FLOOR_O]: '#162416',
  [T.FLOOR_M]: '#141E2A',
  [T.FLOOR_C]: '#221A10',
  [T.FLOOR_S]: '#0E0E1E',
  [T.FLOOR_L]: '#180E2A',
  [T.FLOOR_L]: '#180E2A',
  [T.WALL]:    '#2A2A3A',
  [T.DESK]:    '#3A2A14',
  [T.TABLE]:   '#3A3010',
  [T.PLANT]:   '#1A3A1A',
  [T.SERVER]:  '#0A0A1E',
  [T.SOFA]:    '#2A0A4A',
  [T.COFFEE]:  '#2A1A08',
  [T.DOOR]:    '#4A3A20',
  [T.PATH]:    '#141A14',
};

// Build the map (28 x 22 tiles)
function buildMap() {
  const W = 28, H = 22;
  const m = Array.from({length:H}, () => Array(W).fill(T.GRASS));
  
  // Outer walls
  for(let r=0;r<H;r++) for(let c=0;c<W;c++) {
    if(r===0||r===H-1||c===0||c===W-1) m[r][c]=T.WALL;
  }
  
  // ── OPEN OFFICE (top-left, cols 1-11, rows 1-9) ──
  for(let r=1;r<10;r++) for(let c=1;c<12;c++) m[r][c]=T.FLOOR_O;
  // inner wall
  for(let r=1;r<10;r++) { m[r][11]=T.WALL; m[r][1]=T.WALL; }
  for(let c=1;c<12;c++) { m[1][c]=T.WALL; m[9][c]=T.WALL; }
  // desks
  [[3,3],[3,6],[3,9],[6,3],[6,6],[6,9]].forEach(([r,c])=>{m[r][c]=T.DESK;m[r][c+1]=T.DESK;});
  // plants
  m[2][2]=T.PLANT; m[2][10]=T.PLANT; m[8][2]=T.PLANT; m[8][10]=T.PLANT;
  // doors
  m[9][5]=T.DOOR; m[9][8]=T.DOOR;

  // ── MEETING ROOM (top-right, cols 13-21, rows 1-8) ──
  for(let r=1;r<9;r++) for(let c=13;c<22;c++) m[r][c]=T.FLOOR_M;
  for(let r=1;r<9;r++) { m[r][13]=T.WALL; m[r][21]=T.WALL; }
  for(let c=13;c<22;c++) { m[1][c]=T.WALL; m[8][c]=T.WALL; }
  // big table
  for(let c=15;c<20;c++) { m[3][c]=T.TABLE; m[4][c]=T.TABLE; m[5][c]=T.TABLE; }
  // whiteboard
  m[2][15]=T.SERVER; m[2][16]=T.SERVER; m[2][17]=T.SERVER;
  // door
  m[8][17]=T.DOOR;

  // ── CAFÉ (top-far-right, cols 23-27, rows 1-10) ──
  for(let r=1;r<11;r++) for(let c=23;c<27;c++) m[r][c]=T.FLOOR_C;
  for(let r=1;r<11;r++) { m[r][23]=T.WALL; m[r][26]=T.WALL; }
  for(let c=23;c<27;c++) { m[1][c]=T.WALL; m[10][c]=T.WALL; }
  // coffee counter
  m[2][24]=T.COFFEE; m[2][25]=T.COFFEE;
  // door
  m[10][24]=T.DOOR;

  // ── CORRIDOR / PATH (row 10-11) ──
  for(let c=1;c<27;c++) { m[10][c]=T.PATH; m[11][c]=T.PATH; }

  // ── LOUNGE (bottom-left, cols 1-10, rows 12-19) ──
  for(let r=12;r<20;r++) for(let c=1;c<11;c++) m[r][c]=T.FLOOR_L;
  for(let r=12;r<20;r++) { m[r][1]=T.WALL; m[r][10]=T.WALL; }
  for(let c=1;c<11;c++) { m[12][c]=T.WALL; m[19][c]=T.WALL; }
  // sofa group
  m[14][3]=T.SOFA; m[14][4]=T.SOFA; m[14][5]=T.SOFA;
  m[16][3]=T.SOFA; m[16][4]=T.SOFA; m[16][5]=T.SOFA;
  m[14][7]=T.TABLE; m[15][7]=T.TABLE;
  // plants
  m[13][2]=T.PLANT; m[18][9]=T.PLANT;
  // door
  m[12][5]=T.DOOR;

  // ── SERVER / AI ROOM (bottom-right, cols 17-27, rows 12-21) ──
  for(let r=12;r<21;r++) for(let c=17;c<27;c++) m[r][c]=T.FLOOR_S;
  for(let r=12;r<21;r++) { m[r][17]=T.WALL; m[r][26]=T.WALL; }
  for(let c=17;c<27;c++) { m[12][c]=T.WALL; m[20][c]=T.WALL; }
  // server racks
  for(let c=19;c<26;c+=2) { m[14][c]=T.SERVER; m[15][c]=T.SERVER; m[16][c]=T.SERVER; }
  // doors
  m[12][20]=T.DOOR; m[12][23]=T.DOOR;

  // ── OUTDOOR paths ──
  for(let r=10;r<22;r++) for(let c=11;c<17;c++) {
    if(m[r][c]===T.GRASS) m[r][c]=T.PATH;
  }
  // bottom corridor
  for(let c=1;c<27;c++) if(m[20][c]===T.GRASS||m[20][c]===T.PATH) m[20][c]=T.PATH;
  for(let c=1;c<27;c++) if(m[21][c]===T.GRASS) m[21][c]=T.WALL;

  return m;
}

let map = buildMap();
const MAP_H = map.length;
const MAP_W = map[0].length;

// ═══════════════════════════════════════════
// ROOM DEFINITIONS
// ═══════════════════════════════════════════
const ROOMS = {
  openOffice: { name:'开放工位区', cx:6, cy:5, spots:[[3,4],[3,7],[6,4],[6,7],[5,5],[4,9]] },
  meeting:    { name:'会议室',    cx:17,cy:4, spots:[[3,15],[3,17],[4,14],[5,15],[5,17],[4,19]] },
  cafe:       { name:'咖啡间',    cx:24,cy:5, spots:[[4,24],[5,24],[6,24],[7,25],[8,24]] },
  lounge:     { name:'休息区',    cx:5, cy:16, spots:[[15,3],[15,4],[15,5],[17,4],[16,6]] },
  server:     { name:'AI计算中心', cx:22,cy:16, spots:[[13,20],[13,22],[13,24],[17,19],[17,21],[17,23]] },
  corridor:   { name:'走廊',      cx:13,cy:11, spots:[[10,5],[10,10],[11,14],[10,20],[11,7]] },
};

// ═══════════════════════════════════════════
// AGENTS
// ═══════════════════════════════════════════
const AGENT_DEFS = [
  { id:'alex',  name:'Alex',  role:'AI工程师',   emoji:'👨‍💻', color:'#A100FF', homeRoom:'openOffice', task:'训练情感分类模型' },
  { id:'may',   name:'May',   role:'产品经理',   emoji:'👩‍💼', color:'#E91E8C', homeRoom:'meeting',    task:'整理需求评审材料' },
  { id:'tom',   name:'Tom',   role:'数据科学家', emoji:'📊',  color:'#1565C0', homeRoom:'openOffice', task:'数据清洗与EDA' },
  { id:'sam',   name:'Sam',   role:'Tech Lead', emoji:'🗣️',  color:'#00695C', homeRoom:'meeting',    task:'架构设计评审' },
  { id:'lisa',  name:'Lisa',  role:'咨询顾问',   emoji:'📝',  color:'#B71C1C', homeRoom:'lounge',     task:'撰写客户提案' },
  { id:'jay',   name:'Jay',   role:'UX设计师',   emoji:'🎨',  color:'#FF6F00', homeRoom:'cafe',       task:'设计原型迭代' },
  { id:'nina',  name:'Nina',  role:'项目经理',   emoji:'📋',  color:'#4A148C', homeRoom:'lounge',     task:'Sprint计划协调' },
  { id:'qoder', name:'Qoder', role:'AI助手',     emoji:'🤖',  color:'#00E5FF', homeRoom:'server',     task:'全员AI协作支持' },
];

// ═══════════════════════════════════════════
// CONVERSATION SCRIPTS

function resizeCanvas() {

}

function drawMap() {
  // background
  ctx.fillStyle = '#080F08';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // draw tiles
  for(let r=0; r<MAP_H; r++) {
    for(let c=0; c<MAP_W; c++) {
      const tile = map[r][c];
      const x = OX + c*TILE;
      const y = OY + r*TILE;

      // base color
      ctx.fillStyle = TILE_COLORS[tile] || '#0C1A0C';
      ctx.fillRect(x, y, TILE, TILE);

      // tile-specific decorations
      if(tile === T.WALL) {
        ctx.fillStyle = 'rgba(255,255,255,0.04)';
        ctx.fillRect(x+1, y+1, TILE-2, TILE/3);
      }
      if(tile === T.DESK) {
        ctx.fillStyle = '#5A3A18';
        ctx.fillRect(x+3, y+3, TILE-6, TILE-8);
        ctx.fillStyle = '#1A3A6B';
        ctx.fillRect(x+5, y+5, TILE-12, TILE-12);
        // monitor glow
        ctx.fillStyle = 'rgba(74,158,255,0.3)';
        ctx.fillRect(x+5, y+5, TILE-12, TILE-12);
      }
      if(tile === T.TABLE) {
        ctx.fillStyle = '#5A4818';
        ctx.fillRect(x+2, y+2, TILE-4, TILE-4);
      }
      if(tile === T.PLANT) {
        ctx.fillStyle = '#2A5A2A';
        ctx.beginPath(); ctx.arc(x+TILE/2, y+TILE/2, 7, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#3A7A3A';
        ctx.beginPath(); ctx.arc(x+TILE/2-3, y+TILE/2-3, 5, 0, Math.PI*2); ctx.fill();
      }
      if(tile === T.SERVER) {
        const flicker = Math.sin(tick*0.08 + c*0.5) > 0.7;
        ctx.fillStyle = '#0A0A1E';
        ctx.fillRect(x+2, y+2, TILE-4, TILE-4);
        for(let i=0;i<3;i++){
          ctx.fillStyle = flicker && i===1 ? '#A100FF' : (i===0?'#00E676':'#1A3A6B');
          ctx.fillRect(x+4, y+4+i*7, 4, 4);
        }
      }
      if(tile === T.SOFA) {
        ctx.fillStyle = '#4A1A7A';
        ctx.fillRect(x+2, y+2, TILE-4, TILE-4);
        ctx.fillStyle = '#6A3A9A';
        ctx.fillRect(x+4, y+4, TILE-8, TILE-8);
      }
      if(tile === T.COFFEE) {
        ctx.fillStyle = '#3A2010';
        ctx.fillRect(x+2, y+2, TILE-4, TILE-4);
        // steam animation
        const sy = Math.sin(tick*0.05)*2;
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(x+12, y+2+sy, 3, 6);
        ctx.fillRect(x+18, y+1+sy, 3, 8);
      }
      if(tile === T.DOOR) {
        ctx.fillStyle = '#8B6A30';
        ctx.fillRect(x+4, y+2, TILE-8, TILE-2);
        ctx.fillStyle = '#FFD600';
        ctx.beginPath(); ctx.arc(x+TILE-7, y+TILE/2, 2, 0, Math.PI*2); ctx.fill();
      }
      if(tile === T.PATH) {
        // subtle path texture
        ctx.fillStyle = 'rgba(255,255,255,0.02)';
        if((r+c)%2===0) ctx.fillRect(x, y, TILE, TILE);
      }

      // room labels (only show at grid positions)
      if(r===2&&c===3) drawRoomLabel(x, y-4, '开放工位区', '#00E676');
      if(r===2&&c===14) drawRoomLabel(x, y-4, '会议室 A', '#00E5FF');
      if(r===2&&c===23) drawRoomLabel(x, y-4, '咖啡间', '#FF6F00');
      if(r===13&&c===2) drawRoomLabel(x, y-4, '休息区', '#A100FF');
      if(r===13&&c===18) drawRoomLabel(x, y-4, 'AI 计算中心', '#FF1744');
    }
  }
}

function drawRoomLabel(x, y, text, color) {
  ctx.font = 'bold 9px Segoe UI';
  ctx.fillStyle = color;
  ctx.globalAlpha = 0.7;
  ctx.fillText(text, x, y+12);
  ctx.globalAlpha = 1;
}

function drawAgent(ag) {
  const x = OX + ag.x;
  const y = OY + ag.y;
  const r = 11;
  const isSelected = selectedAgent && selectedAgent.id === ag.id;

  // glow ring for selected
  if(isSelected) {
    ctx.beginPath(); ctx.arc(x, y, r+6, 0, Math.PI*2);
    const grad = ctx.createRadialGradient(x,y,r,x,y,r+6);
    grad.addColorStop(0, ag.color+'88'); grad.addColorStop(1,'transparent');
    ctx.fillStyle = grad; ctx.fill();
  }

  // shadow
  ctx.beginPath(); ctx.arc(x+1, y+2, r, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill();

  // body circle
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fillStyle = ag.color+'CC'; ctx.fill();
  ctx.strokeStyle = ag.color; ctx.lineWidth = 2; ctx.stroke();

  // inner circle
  ctx.beginPath(); ctx.arc(x, y, r-3, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fill();

  // emoji
  ctx.font = '12px serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(ag.emoji, x, y+1);

  // status dot
  const statusColors = { working:'#00E676', meeting:'#00E5FF', idle:'#888', chat:'#FFD600' };
  ctx.beginPath(); ctx.arc(x+r-2, y-r+2, 4, 0, Math.PI*2);
  ctx.fillStyle = statusColors[ag.status]||'#888'; ctx.fill();
  ctx.strokeStyle = '#0A0A14'; ctx.lineWidth = 1.5; ctx.stroke();

  // name tag
  ctx.font = 'bold 8px Segoe UI';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const tw = ctx.measureText(ag.name).width;
  ctx.fillStyle = 'rgba(10,10,20,0.85)';
  ctx.fillRect(x-tw/2-3, y+r+2, tw+6, 12);
  ctx.fillStyle = ag.color; ctx.fillText(ag.name, x, y+r+3);

  // speech bubble
  if(ag.bubbleTimer > 0 && ag.bubble) {
    drawBubble(x, y-r-4, ag.bubble, ag.color);
  }
}

function drawBubble(x, y, text, color) {
  const lines = text.split('\n');
  const maxW = Math.max(...lines.map(l=>{
    ctx.font = '9px Segoe UI';
    return ctx.measureText(l).width;
  }));
  const bw = maxW + 14;
  const bh = lines.length * 12 + 10;
  const bx = x - bw/2;
  const by = y - bh;

  // bubble bg
  ctx.fillStyle = 'rgba(10,10,20,0.92)';
  roundRect(bx, by, bw, bh, 6); ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 1.5; roundRect(bx, by, bw, bh, 6); ctx.stroke();

  // tail
  ctx.fillStyle = 'rgba(10,10,20,0.92)';
  ctx.beginPath(); ctx.moveTo(x-4,y); ctx.lineTo(x+4,y); ctx.lineTo(x,y+5); ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x-4,y); ctx.lineTo(x,y+5); ctx.lineTo(x+4,y); ctx.stroke();

  // text
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.font = '9px Segoe UI';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  lines.forEach((line, i) => {
    ctx.fillText(line, x, by+5+i*12);
  });
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

function moveAgentToward(ag) {
  const dx = ag.tx - ag.x;
  const dy = ag.ty - ag.y;
  const dist = Math.sqrt(dx*dx+dy*dy);
  const speed = ag.id==='qoder' ? 2.2 : 1.4;
  if(dist < speed) {
    ag.x = ag.tx; ag.y = ag.ty;
  } else {
    ag.x += (dx/dist)*speed;
    ag.y += (dy/dist)*speed;
  }
}

function pickNewDestination(ag) {
  // randomly decide which room to go to
  const rooms = Object.keys(ROOMS);
  const roomKey = rooms[Math.floor(Math.random()*rooms.length)];
  const room = ROOMS[roomKey];
  const spot = room.spots[Math.floor(Math.random()*room.spots.length)];
  ag.tx = spot[1]*TILE + TILE/2 + (Math.random()-0.5)*10;
  ag.ty = spot[0]*TILE + TILE/2 + (Math.random()-0.5)*10;
  ag.currentRoom = roomKey;
  ag.status = STATUS_MAP[roomKey] || 'idle';
  const th = THOUGHTS[roomKey];
  ag.thought = th[Math.floor(Math.random()*th.length)];
}

// ═══════════════════════════════════════════
// CONVERSATION ENGINE
// ═══════════════════════════════════════════
function runConversation() {
  if(tick < nextConvoTick) return;
  if(!activeConvo) {
    // pick a convo
    const ci = Math.floor(Math.random()*CONVOS.length);
    activeConvo = CONVOS[ci];
    convoMsgIdx = 0;
    // move participants to convo place
    const room = ROOMS[activeConvo.place];
    activeConvo.agents.forEach((aid, i) => {
      const ag = agents.find(a=>a.id===aid);
      if(!ag) return;
      const spot = room.spots[i % room.spots.length];
      ag.tx = spot[1]*TILE + TILE/2;
      ag.ty = spot[0]*TILE + TILE/2;
      ag.currentRoom = activeConvo.place;
      ag.status = 'meeting';
    });
    convoTick = tick + 60; // wait for move
  }

  if(tick >= convoTick && activeConvo) {
    if(convoMsgIdx < activeConvo.msgs.length) {
      const msg = activeConvo.msgs[convoMsgIdx];
      const ag = agents.find(a=>a.id===msg.a);
      if(ag) {
        ag.bubble = msg.t.length > 20 ? msg.t.slice(0,18)+'...' : msg.t;
        ag.bubbleTimer = 120;
        ag.speaking = true;
      }
      // add to chat log
      addChatMsg(msg.a, msg.t);
      convoMsgIdx++;
      convoTick = tick + 90;
    } else {
      // convo done
      activeConvo.agents.forEach(aid => {
        const ag = agents.find(a=>a.id===aid);
        if(ag) { ag.speaking = false; ag.status = 'working'; }
      });
      activeConvo = null;
      nextConvoTick = tick + 200 + Math.random()*150;
    }
  }
}

// click on canvas to select agent
canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  let closest = null, minD = 20;
  agents.forEach(ag => {
    const ax = OX+ag.x, ay = OY+ag.y;
    const d = Math.sqrt((mx-ax)**2+(my-ay)**2);
    if(d<minD) { minD=d; closest=ag; }
  });
  if(closest) selectAgent(closest);
  else {
    selectedAgent = null;
    document.getElementById('agentSpotlight').style.display='none';
  }
});

let clockTick = 0;
function updateClock() {
  clockTick++;
  if(clockTick % 2 === 0) {
    simMinutes++;
    if(simMinutes >= 20*60) simMinutes = 8*60; // reset to 8:00
  }
  const h = Math.floor(simMinutes/60);
  const m = String(simMinutes%60).padStart(2,'0');
  document.getElementById('simClock').textContent = `${h}:${m}`;
}

// ═══════════════════════════════════════════
// EVENT AUTOMATION
// ═══════════════════════════════════════════
const autoEvents = [
  { tick: 150,  text:'📢 Alex 提交了新的模型版本 v2.1', type:'ev-purple' },
  { tick: 300,  text:'✅ Qoder 完成代码审查，发现 2 个优化点', type:'ev-cyan' },
  { tick: 500,  text:'📋 May 使用 Qoder 生成 PRD 草稿完成', type:'ev-amber' },
  { tick: 700,  text:'🧠 GPU #3 训练完成，准确率 96.8%', type:'ev-green' },
  { tick: 900,  text:'📄 Lisa 的 Executive Summary 已导出', type:'ev-purple' },
  { tick: 1100, text:'🗣 Sam 发起架构评审会议邀请', type:'ev-cyan' },
  { tick: 1300, text:'🎨 Jay 的 UI 原型通过 Figma MCP 转为代码', type:'ev-amber' },
  { tick: 1500, text:'📊 Tom 数据管道处理完成 12万条记录', type:'ev-green' },
  { tick: 1700, text:'🤖 Qoder 生成 Sprint 总结报告', type:'ev-purple' },
  { tick: 1900, text:'✨ 全员 Sprint Review 开始！', type:'ev-cyan' },
];

// task progress simulation
function updateTaskProgress() {
  if(tick % 80 === 0) {
    const t = tasks[Math.floor(Math.random()*tasks.length)];
    if(t.progress < 100) {
      t.progress = Math.min(100, t.progress + Math.floor(Math.random()*4+1));
      renderTaskList();
    }
  }
}

// ═══════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════
function loop() {
  if(!paused) {
    tick++;
    updateClock();
    updateTaskProgress();

    // move agents
    agents.forEach(ag => {
      ag.moveTimer--;
      if(ag.moveTimer <= 0 && !ag.speaking) {
        pickNewDestination(ag);
        ag.moveTimer = 150 + Math.random()*250;
      }
      moveAgentToward(ag);
      if(ag.bubbleTimer > 0) ag.bubbleTimer--;
    });

    // Qoder moves faster and visits everyone
    const qoder = agents.find(a=>a.id==='qoder');
    if(qoder && tick%120===0) {
      const others = agents.filter(a=>a.id!=='qoder');
      const target = others[Math.floor(Math.random()*others.length)];
      qoder.tx = target.tx + 20;
      qoder.ty = target.ty;
      qoder.currentRoom = target.currentRoom;
    }

    // conversations
    runConversation();

    // auto events
    autoEvents.forEach(ev => {
      if(tick === ev.tick) addEventChip(ev.text, ev.type);
    });
    // loop events
    if(tick % 600 === 0 && tick > 0) {
      autoEvents.forEach(ev => ev.tick += 2000);
    }

    // update UI panels every 30 ticks
    if(tick % 30 === 0) {
      renderAgentList();
      if(selectedAgent) {
        const ag = agents.find(a=>a.id===selectedAgent.id);
        if(ag) selectAgent(ag);
      }
    }

    // update spotlight thought
    if(selectedAgent && tick%60===0) {
      const ag = agents.find(a=>a.id===selectedAgent.id);
      if(ag) document.getElementById('spotThought').textContent = '💭 '+ag.thought;
    }
  }

  // draw
  drawMap();
  agents.forEach(drawAgent);

  // draw movement path (thin line to target)
  agents.forEach(ag => {
    const dx = ag.tx-ag.x, dy = ag.ty-ag.y;
    if(Math.sqrt(dx*dx+dy*dy) > 20) {
      ctx.beginPath();
      ctx.moveTo(OX+ag.x, OY+ag.y);
      ctx.lineTo(OX+ag.tx, OY+ag.ty);
      ctx.strokeStyle = ag.color+'30';
      ctx.lineWidth = 1;
      ctx.setLineDash([3,4]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  });

  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════
// CONTROLS
// ═══════════════════════════════════════════
function togglePause() {
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? '▶ 继续' : '⏸ 暂停';
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
renderAgentList();
renderTaskList();
addEventChip('🚀 AI Town 启动！Sprint Day 3 开始', 'ev-purple');
addEventChip('🤖 Qoder AI 助手已上线，开始协助全员工作', 'ev-cyan');
// init agent thoughts
agents.forEach(ag => {
  const th = THOUGHTS[ag.homeRoom] || THOUGHTS.corridor;
  ag.thought = th[Math.floor(Math.random()*th.length)];
});
loop();
</script>
