# Pre-commit 配置文件（简化版 - 仅保留安全检查）
# 在 git commit 前自动运行代码检查工具
# 使用方法：
#   1. pip install pre-commit
#   2. pre-commit install
#   3. 提交代码时会自动运行以下检查

repos:
  # 通用检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # 检测大型文件（>500KB）
      - id: check-added-large-files
        args: ["--maxkb=500"]
      # 检测敏感信息（密码、密钥等）
      - id: detect-private-key

